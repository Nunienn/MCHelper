name: Build APK
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MCHelper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK sur la branche "apk"
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/
          cd /tmp/out && git init -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add app-debug.apk && git commit -q -m "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
